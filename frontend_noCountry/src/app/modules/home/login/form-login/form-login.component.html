<form [formGroup]="loginForm" (ngSubmit)="handleLogin()" class="space-y-6">
  <div class="space-y-4">
     <div class="space-y-2">
    <label for="email" class="block text-sm font-medium">Correo electrónico</label>

    <div class="relative">
      <!-- <i class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">📧</i> -->

      <input
        id="email"
        type="email"
        placeholder="tu@email.com"
        formControlName="email"
        class="w-full pl-10 pr-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <div *ngIf="email?.touched && email?.invalid" class="text-red-500 text-sm mt-1">
      <div *ngIf="email?.errors?.['required']">El correo es obligatorio.</div>
      <div *ngIf="email?.errors?.['email']">Ingrese un correo válido.</div>
    </div>
  </div>

    <div class="space-y-2">
    <div class="flex items-center justify-between">
      <label for="password" class="block text-sm font-medium">Contraseña</label>
      <button type="button" class="text-sm text-blue-600 hover:underline">
        ¿Olvidaste tu contraseña?
      </button>
    </div>

    <div class="relative">
      <!-- <i class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">🔒</i> -->
      <input
        id="password"
        type="password"
        placeholder="••••••••"
        formControlName="password"
        class="w-full pl-10 pr-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <div *ngIf="password?.touched && password?.invalid" class="text-red-500 text-sm mt-1">
      <div *ngIf="password?.errors?.['required']">La contraseña es obligatoria.</div>
    </div>
  </div>

    <!-- <div class="bg-muted/50 rounded-lg p-3 text-xs text-muted-foreground space-y-1">
      <p class="font-medium">Demo - Credenciales de prueba:</p>
      <p>• Paciente: paciente&#64;demo.com</p>
      <p>• Médico: doctor&#64;demo.com</p>
      <p>• Admin: admin&#64;demo.com</p>
      <p class="pt-1">Contraseña: cualquiera</p>
    </div> -->
  </div>

  <div *ngIf="error" class="border border-red-500 bg-red-100 p-2 rounded flex items-center space-x-2">
    <span>❌</span>
    <span>{{ error }}</span>
  </div>

  <div *ngIf="success" class="border border-green-500 bg-green-100 p-2 rounded flex items-center space-x-2">
    <span>✅</span>
    <span>{{ success }}</span>
  </div>

  <!-- <button type="submit" class="w-full" [disabled]="isLoading">
    <ng-container *ngIf="isLoading; else notLoading">
      <span class="animate-spin">⏳</span> Iniciando sesión...
    </ng-container>
    <ng-template #notLoading>Iniciar sesión</ng-template>
  </button> -->
  <button
  type="submit"
  class="w-full flex items-center justify-center bg-black text-white py-2 rounded-md hover:bg-gray-800 hover:cursor-pointer disabled:bg-blue-400 transition-all"
  [disabled]="isLoading"
>
  <ng-container *ngIf="isLoading; else normalText">
    <svg
      class="animate-spin h-4 w-4 mr-2 text-white"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
    >
      <circle
        class="opacity-25"
        cx="12"
        cy="12"
        r="10"
        stroke="currentColor"
        stroke-width="4"
      ></circle>
      <path
        class="opacity-75"
        fill="currentColor"
        d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
      ></path>
    </svg>
    Iniciando sesión...
  </ng-container>

  <ng-template #normalText>
    Iniciar sesión
  </ng-template>
</button>

</form>
