<div className="min-h-screen">
  <app-navbar panelTitle="Panel de Administración" userRole="Admin" userSubtitle="Administrador"></app-navbar>
  <div class="container mt-20 mx-auto px-3 sm:px-4 py-4 sm:py-8">
    <div class="mb-4 sm:mb-8">
      <h2 class="text-2xl sm:text-3xl font-bold mb-1 sm:mb-2 text-primary-blue">
        Panel de Control
      </h2>
      <p class="text-sm sm:text-base text-text-muted">
        Gestiona usuarios, configuraciones y monitorea el sistema
      </p>
    </div>    
    <app-patient-metric [stats]="stats" [nextAppointment]="nextAppointment"></app-patient-metric>
    <!-- Grid principal -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-6">
      <!-- Main Content -->
      <div class="lg:col-span-2 space-y-4 sm:space-y-6">
        <!-- Management Tabs -->
        <div class="w-full">
          <div class="grid w-full grid-cols-2 sm:grid-cols-4 bg-gray-soft rounded-md p-1">
            @for (tab of tabs; track tab.value) {
            <button class="text-xs sm:text-sm py-2 px-4 rounded-md transition-colors duration-150" [ngClass]="{
              'bg-primary-blue text-white shadow': activeTab === tab.value,
              'text-gray-700 hover:bg-gray-200': activeTab !== tab.value
            }" [attr.data-state]="activeTab === tab.value ? 'active' : ''" (click)="setActive(tab.value)">
              {{ tab.label }}
            </button>
            }
          </div>

          <!-- Contenido del tab -->
          <div class="mt-4">
            <!-- Usamos [hidden] para mantener vivos los componentes de las pestañas y evitar el salto de scroll -->
            <app-doctors-management [hidden]="activeTab !== 'doctors'"></app-doctors-management>
            <app-appointment-management [hidden]="activeTab !== 'appointments'"></app-appointment-management>
            <app-data-management [hidden]="activeTab !== 'data'"></app-data-management>
            <app-clinical-history [hidden]="activeTab !== 'history'"></app-clinical-history >
          </div>
        </div>
      </div>
      <!-- Sidebar opcional -->
      <div class="bg-white p-4 rounded-md shadow-sm">
        <p class="text-sm sm:text-base">Panel lateral / información adicional</p>
      </div>
    </div>
  </div>
</div>
