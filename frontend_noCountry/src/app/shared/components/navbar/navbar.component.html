<header class="border-b bg-white/80 backdrop-blur-sm fixed h-20 w-full top-0 z-50 shadow-sm">
  <div class="container mx-auto px-3 sm:px-4 py-3 sm:py-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="w-10 h-10 sm:w-10 sm:h-10 flex items-center justify-center">
          <img src="assets/images/logo-sin-fondo.png" alt="MediConnect" class="logo-icon" />
        </div>
        <div>
          <h1 class="text-base sm:text-xl font-bold mb-1 sm:mb-2 text-primary-blue">MediConnect</h1>
          <p class="text-[10px] sm:text-xs text-primary-green hidden sm:block font-medium">
            {{ panelTitle }}
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3">

        <div *ngIf="user" class="hidden md:flex items-center gap-3 pl-3 border-l border-blue-light">
          <div *ngIf="user.urlImage; else initials" class="h-9 w-9 rounded-full overflow-hidden">
            <img [src]="user.urlImage" alt="Foto de perfil" class="w-full h-full object-cover">
          </div>
          <ng-template #initials>
            <div class="h-9 w-9 rounded-full bg-gray-200 flex items-center justify-center overflow-hidden">
              <span class="text-sm font-medium text-gray-600">{{ userInitials }}</span>
            </div>
          </ng-template>
          <div>
            <p class="text-sm font-medium text-primary-blue">{{ user.firstName }} {{ user.lastName }}</p>
            <p class="text-xs text-primary-green">{{ userRoleDisplay }}</p>
          </div>
        </div>

        <button class="h-8 w-8 sm:h-10 sm:w-10 hover:bg-blue-light inline-flex items-center justify-center rounded-md transition-colors" (click)="logout()">
          <svg class="h-4 w-4 sm:h-5 sm:w-5 text-primary-blue" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" x2="9" y1="12" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</header>
