<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-4 sm:mb-8">
  @for (stat of stats; track stat.title) {
    <div class="hover:shadow-lg transition-shadow border-0 bg-white rounded-lg shadow">
      <div class="p-3 sm:p-6">
        <div class="flex items-start justify-between mb-2 sm:mb-4">
          <div [class]="'w-8 h-8 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center ' + stat.bgColor">
            <lucide-angular 
              [img]="getIcon(stat.icon)" 
              [class]="'w-4 h-4 sm:w-6 sm:h-6 ' + stat.iconColor">
            </lucide-angular>
          </div>
          <lucide-angular 
            [img]="getIcon('trending-up')" 
            class="w-3 h-3 sm:w-4 sm:h-4 text-[#2ead4e]">
          </lucide-angular>
        </div>
        <div>
          <p class="text-[10px] sm:text-sm text-[#999] mb-1">{{ stat.title }}</p>
          <p class="text-xl sm:text-3xl font-bold text-[#1877f2] mb-1">{{ stat.value }}</p>
          <p class="text-[10px] sm:text-xs text-[#2ead4e]">{{ stat.change }}</p>
        </div>
      </div>
    </div>
  }
</div>
